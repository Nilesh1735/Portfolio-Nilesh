<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Illustrated portrait of Nilesh Raj">
  <circle cx="100" cy="100" r="100" fill="#dd0200"/>
  <g transform="translate(-19.85 -13.09) scale(1.1534)">
<!-- ear, no earring -->
  <path d="M139 108c7-3 12 3 11 11s-7 13-13 11" fill="#fff" stroke="#111" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M142 114c3 1 4 4 3 7" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>

  <!-- face: narrower than before -->
  <path fill="#fff" stroke="#111" stroke-width="3.4" stroke-linejoin="round"
        d="M66 100c-1-25 15-45 34-45 19 0 35 20 35 44 0 25-4 42-12 54-6 9-14 14-23 14-9 0-17-5-23-14-8-12-12-28-11-53z"/>

  <!-- FULL BEARD, slightly ragged lower edge -->
  <path fill="#111" d="M69 118
      C71 130 76 138 85 142
      C90 145 95 146 100 146
      C105 146 110 145 115 142
      C124 138 129 130 131 118
      C132 136 128 150 120 160
      C114 166 107 169 100 169
      C93 169 86 166 80 160
      C72 150 68 136 69 118 Z"/>
  <path fill="#fff" d="M91 149c3-1.4 6-2 9-2s6 .6 9 2c-2.3 4-5.5 5.6-9 5.6s-6.7-1.6-9-5.6z"/>
  <path fill="#111" d="M100 142c-5-5-13-6-19-3 1-5 7-8 13-6 2 1 4 2 6 3 2-1 4-2 6-3 6-2 12 1 13 6-6-3-14-2-19 3z"/>

  <!-- HAIR as overlapping curl lobes -->
  <path fill="#111" d="M64 104
      C55 89 54 71 60 59
      C63 52 68 48 73 49
      C71 40 77 33 86 32
      C91 31 95 33 97 37
      C99 28 109 25 116 29
      C120 31 122 35 122 39
      C127 33 134 33 139 38
      C143 42 145 48 144 54
      C149 62 150 76 148 88
      C147 93 145 98 142 102
      C141 93 138 87 134 83
      C131 89 127 93 122 95
      C123 89 121 84 118 81
      C109 91 93 95 80 92
      C74 90 69 86 66 81
      C64 87 64 96 64 104 Z"/>
  <!-- white gaps between curls -->
  <g stroke="#fff" stroke-linecap="round" fill="none">
    <path d="M75 57c-4 5-6 10-6 16" stroke-width="2.8"/>
    <path d="M89 40c-4 4-7 9-8 15" stroke-width="2.4"/>
    <path d="M104 33c-3 3-5 7-6 11" stroke-width="2.2"/>
    <path d="M118 35c-3 3-5 6-5 10" stroke-width="2.6"/>
    <path d="M134 43c-3 4-4 8-4 12" stroke-width="2.3"/>
    <path d="M143 60c2 7 3 14 2 21" stroke-width="2.5"/>
    <path d="M69 76c0-5 1-10 2-14" stroke-width="2.2"/>
    <path d="M97 48c-3 4-5 8-5 13" stroke-width="2"/>
  </g>

  <!-- brows: low, angular, slightly uneven -->
  <g fill="#111">
    <path d="M73 100c8-6 17-6 23-1 1 4-2 6-4 5-5-3-11-2-16 1-3 1-4-3-3-5z"/>
    <path d="M128 99c-8-6-17-5-23 0-1 4 2 6 4 5 5-3 11-2 16 1 3 1 4-3 3-6z"/>
  </g>

  <!-- eyes: white almond, heavy upper lid, small pupil -->
  <g>
    <path fill="#fff" stroke="#111" stroke-width="2.4" stroke-linejoin="round"
          d="M77 112c4-4 12-4 16 0-3 4-6 6-8 6s-5-2-8-6z"/>
    <path fill="#111" d="M77 112c4-4 12-4 16 0-5-1-11-1-16 0z"/>
    <circle cx="85" cy="113.5" r="2.4" fill="#111"/>

    <path fill="#fff" stroke="#111" stroke-width="2.4" stroke-linejoin="round"
          d="M124 111c-4-4-12-4-16 0 3 4 6 6 8 6s5-2 8-6z"/>
    <path fill="#111" d="M124 111c-4-4-12-4-16 0 5-1 11-1 16 0z"/>
    <circle cx="116" cy="112.5" r="2.4" fill="#111"/>
  </g>

  <!-- blush -->
  <g fill="#f3959c" opacity="0.85">
    <ellipse cx="78" cy="127" rx="8.5" ry="5.5" transform="rotate(-6 78 127)"/>
    <ellipse cx="124" cy="126" rx="8.5" ry="5.5" transform="rotate(6 124 126)"/>
  </g>

  <!-- nose -->
  <path d="M100 116v11c0 2.8-2.8 3.8-5.5 3.2" fill="none" stroke="#111" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</svg>
