<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Illustrated portrait of Nilesh Raj">
  <circle cx="100" cy="100" r="100" fill="#dd0200"/>
  <g transform="translate(-20.18 -21.80) scale(1.2012)">
<!-- ears -->
  <g fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round">
    <path d="M59 105c-7-2-11 4-9 11s8 11 13 9z"/>
    <path d="M141 105c7-2 11 4 9 11s-8 11-13 9z"/>
  </g>
  <circle cx="145" cy="129" r="4" fill="none" stroke="#111" stroke-width="2.6"/>

  <!-- face -->
  <path fill="#fff" stroke="#111" stroke-width="3.2" stroke-linejoin="round"
        d="M60 100c0-24 18-43 40-43s40 19 40 43c0 23-4 39-13 51-7 9-16 14-27 14s-20-5-27-14c-9-12-13-28-13-51z"/>

  <!-- light stubble: short ticks hugging the jaw, not the cheeks -->
  <g stroke="#111" stroke-width="2.2" stroke-linecap="round" opacity="0.45">
    <path d="M76 148l-2 5"/><path d="M83 155l-2 5"/><path d="M91 160l-1 5"/>
    <path d="M124 148l2 5"/><path d="M117 155l2 5"/><path d="M109 160l1 5"/>
  </g>

  <!-- HAIR: one closed shape — crown over the top, swept fringe across the brow -->
  <path fill="#111" d="M58 114
      C49 86 52 56 72 43
      C89 32 115 32 131 43
      C151 56 150 87 142 114
      C140 98 136 88 130 82
      C119 94 101 98 85 92
      C75 88 65 98 58 114 Z"/>

  <!-- hair highlights -->
  <g stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M76 65c6-9 15-15 24-17"/>
    <path d="M106 47c10 1 18 6 24 14"/>
    <path d="M67 88c2-7 4-13 8-18"/>
  </g>

  <!-- brows -->
  <g fill="#111">
    <path d="M70 98c8-6 18-6 25-2 1 3-1 6-3 5-6-2-13-2-19 1-3 1-4-2-3-4z"/>
    <path d="M130 98c-8-6-18-6-25-2-1 3 1 6 3 5 6-2 13-2 19 1 3 1 4-2 3-4z"/>
  </g>
  <!-- eyes -->
  <g fill="#111">
    <path d="M75 111c4-5 13-5 18 0-2 4-7 6-11 5-3-1-6-3-7-5z"/>
    <path d="M125 111c-4-5-13-5-18 0 2 4 7 6 11 5 3-1 6-3 7-5z"/>
  </g>

  <!-- blush -->
  <g fill="#f4959d" opacity="0.8">
    <ellipse cx="74" cy="129" rx="10" ry="6"/>
    <ellipse cx="126" cy="129" rx="10" ry="6"/>
  </g>

  <!-- nose -->
  <path d="M100 115v10c0 2.5-2.5 4-5 3.5" fill="none" stroke="#111" stroke-width="2.8" stroke-linecap="round"/>

  <!-- moustache / mouth / soul patch -->
  <path fill="#111" d="M100 145c-7-5-14-6-20-3 2-5 8-7 13-6 3 1 5 2 7 4 2-2 4-3 7-4 5-1 11 1 13 6-6-3-13-2-20 3z"/>
  <path d="M93 151c5 2 11 2 15 0" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"/>
  <path fill="#111" d="M96 157h8c1 0 2 1 2 2 0 5-3 9-6 9s-6-4-6-9c0-1 1-2 2-2z"/>
  </g>
</svg>
